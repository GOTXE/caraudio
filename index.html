<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="app-version" content="v0.1.0-alpha.6" />
    <meta name="update-repo" content="GOTXE/caraudio" />
    <title>Music Skin ND</title>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="title">
          <h1>
            Music Skin ND
          </h1>
          <div class="sub">Skin local para Navidrome.</div>
        </div>
        <div class="headerCenter" aria-label="Versión">
          <div class="pill mono" id="verCurrent" title="Versión actual"></div>
          <div class="pill pillGlow mono" id="verLatest" title="Hay una versión nueva disponible" hidden></div>
          <button class="ghostBtn whatsNewBtn" id="btnWhatsNew" title="Ver novedades">Novedades</button>
        </div>
        <div class="headerRight">
          <span class="headerUser mono" id="headerUser" hidden>@—</span>
          <button class="iconBtn" id="btnOpenMenu" aria-label="Abrir menú" title="Menú">☰</button>
        </div>
      </header>

      <!-- LOGIN -->
      <div class="screen" id="screenLogin">
        <div class="loginWrap">
          <section class="card loginCard">
            <div class="topBar">
            </div>

            <button class="ghostBtn serverBtn" id="btnEditServer" type="button">Servidor no configurado</button>

	            <label for="username">Usuario</label>
	            <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" enterkeyhint="next" />
	
	            <label for="password">Contraseña</label>
	            <input
	              id="password"
	              type="password"
	              autocomplete="current-password"
	              autocapitalize="none"
	              spellcheck="false"
	              enterkeyhint="done"
	            />

            <button class="btn" id="btnConnect">Conectar</button>
            <label class="rememberRow" for="rememberCreds">
              <input id="rememberCreds" type="checkbox" />
              <span>Recordar credenciales</span>
            </label>

            <div class="status" id="status">Esperando…</div>
          </section>
        </div>
      </div>

      <!-- PLAYER -->
      <div class="screen" id="screenPlayer" hidden>
        <div class="playerGrid" id="playerGrid" data-list-pane="right">
          <section class="card artistsPane">
            <div class="topBar">
              <div class="viewTabs">
                <button class="segBtn active" id="btnViewArtists">Artistas</button>
                <button class="segBtn" id="btnViewGenres">Géneros</button>
                <button class="segBtn" id="btnViewAlbums">Álbumes</button>
                <button class="segBtn" id="btnViewPlaylists">Listas</button>
                <button class="segBtn" id="btnViewFavorites">Favoritas</button>
                <button class="segBtn" id="btnViewMostPlayed">Más reproducidas</button>
              </div>
            </div>
            <div class="filterWrap">
              <input id="artistFilter" placeholder="Filtrar artista…" />
              <button class="segBtn iconOnly filterClearBtn" id="btnClearArtists" title="Limpiar" aria-label="Limpiar">🧹</button>
            </div>
            <div class="artistsList" id="artistsList"></div>
          </section>

          <section class="rightPane">
            <section class="card nowPanel">
              <div class="nowBg" id="nowBg"></div>
              <div class="topBar">
                <div class="sideBtns">
                  <button class="ghostBtn" id="btnAlbums" disabled>Álbumes</button>
                  <button class="ghostBtn" id="btnSongs" disabled>Canciones</button>
                </div>
                <button class="ghostBtn" id="btnFavoriteSong" title="Marcar favorita" aria-label="Favorita">♡ Favorita</button>
              </div>

              <div class="nowContent">
                <div class="songMenu" id="songMenu"></div>
                <div class="nowMeta">
                  <div class="coverWrap">
                    <div class="pauseHint" id="pauseHint" hidden>PAUSA</div>
                    <img class="coverXL" id="nowCover" alt="" src="./assets/img/music-player.svg" />
                  </div>
                  <div>
                    <div class="bigTitle" id="nowTitle">Nada reproduciendo</div>
                    <div class="bigSub" id="nowSub">—</div>
                  </div>
                </div>
              </div>

              <audio id="player" preload="none"></audio>
              <div class="timeRow">
                <span class="mono" id="tNow">0:00</span>
                <span class="mono" id="tDur">0:00</span>
              </div>
              <div class="progressWrap" aria-label="Progreso">
                <div class="progressBuf" id="bufBar"></div>
                <div class="progressNow" id="nowBar"></div>
                <input class="seek" id="seek" type="range" min="0" max="1000" value="0" />
              </div>
            </section>

            <section class="card">
              <div class="controlsBar">
                <button id="btnPrev">◀◀</button>
                <button class="primary" id="btnPlayPause">▶︎ / ❚❚</button>
                <button id="btnNext">▶▶</button>
                <button id="btnShuffle">Aleatorio</button>
                <button id="btnPlayAll">Reproducir todo</button>
              </div>
            </section>
          </section>
        </div>
      </div>
    </div>

    <!-- Modal álbumes -->
    <div class="modal" id="albumsModal" hidden>
      <section class="card modalCard">
        <div class="topBar">
          <div class="pill" id="albumsTitle">Álbumes</div>
          <div style="display:flex;gap:10px;align-items:center">
            <button class="ghostBtn" id="btnPlayAllAlbums">Reproducir todo</button>
            <button class="ghostBtn" id="btnCloseAlbums">Cerrar</button>
          </div>
        </div>
        <div class="modalList" id="albumsList"></div>
      </section>
    </div>

    <!-- Modal canciones -->
    <div class="modal" id="songsModal" hidden>
      <section class="card modalCard">
        <div class="topBar">
          <div class="pill" id="songsTitle">Canciones</div>
          <button class="ghostBtn" id="btnCloseSongs">Cerrar</button>
        </div>
        <div class="modalList" id="songsList"></div>
      </section>
    </div>

    <!-- Modal servidor -->
    <div class="modal modalTop" id="serverModal" hidden>
      <section class="card modalCard" style="max-height: min(280px, 100%)">
        <div class="topBar">
          <div class="modalTitleRow">
            <div class="pill">Servidor Navidrome</div>
            <div class="serverCheck" id="serverCheck" data-state="idle" aria-live="polite" title="Sin comprobar">
              <span class="dot" aria-hidden="true"></span>
              <span id="serverCheckText">Sin comprobar</span>
            </div>
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <button class="ghostBtn" id="btnServerCancel">Cancelar</button>
            <button class="ghostBtn" id="btnServerSave">Aceptar</button>
          </div>
        </div>

	        <label for="serverUrlInput">URL</label>
	        <input
	          id="serverUrlInput"
	          type="url"
	          inputmode="url"
	          autocomplete="url"
	          autocapitalize="none"
	          spellcheck="false"
	          enterkeyhint="done"
	          placeholder="https://navidrome.tudominio.com"
	        />
      </section>
    </div>

    <!-- Modal novedades -->
    <div class="modal" id="whatsNewModal" hidden>
      <section class="card modalCard whatsNewCard">
        <div class="topBar">
          <div class="pill" id="whatsNewTitle">Mejoras en v...</div>
          <button class="ghostBtn" id="btnCloseWhatsNew">Entendido</button>
        </div>
        <div class="modalList whatsNewList" id="whatsNewList"></div>
      </section>
    </div>

    <!-- Modal menú -->
    <div class="modal modalTop" id="menuModal" hidden>
      <section class="card modalCard menuCard">
        <div class="topBar">
          <div class="pill">Ajustes</div>
          <button class="ghostBtn" id="btnCloseMenu">Cerrar</button>
        </div>
        <div class="menuRows">
          <div class="menuRow">
            <div class="menuLabel">Tema</div>
            <div class="menuThemeOptions">
              <button class="segBtn" id="btnThemeDay">Día</button>
              <button class="segBtn" id="btnThemeNight">Noche</button>
              <button class="segBtn" id="btnThemeAuto">Auto</button>
              <button class="ghostBtn" id="btnThemeAutoConfig" title="Configurar auto">Configurar</button>
            </div>
            <div class="menuHint mono" id="themeAutoHint"></div>
          </div>
          <div class="menuRow">
            <div class="menuLabel">Panel listas</div>
            <button class="ghostBtn" id="btnPaneSide" title="Cambiar posición de listas">Listas: Der</button>
          </div>
          <div class="menuRow">
            <div class="menuLabel">Usuario</div>
            <button class="ghostBtn" id="btnOpenProfiles" title="Cambiar usuario">Cambiar usuario</button>
          </div>
        </div>
      </section>
    </div>

    <!-- Modal perfiles -->
    <div class="modal modalTop" id="profilesModal" hidden>
      <section class="card modalCard">
        <div class="topBar">
          <div class="pill">Perfiles</div>
          <button class="ghostBtn" id="btnCloseProfiles">Cerrar</button>
        </div>
        <div class="modalList" id="profilesList"></div>
        <div class="topBar">
          <button class="ghostBtn" id="btnAddProfile">Añadir nuevo perfil</button>
        </div>
      </section>
    </div>

    <!-- Modal tema auto -->
    <div class="modal modalTop" id="autoThemeModal" hidden>
      <section class="card modalCard autoThemeCard">
        <div class="topBar">
          <div class="pill">Tema automático</div>
          <div style="display:flex;gap:10px;align-items:center">
            <button class="ghostBtn" id="btnAutoThemeCancel">Cancelar</button>
            <button class="ghostBtn" id="btnAutoThemeSave">Guardar</button>
          </div>
        </div>
        <label for="autoThemeTimezone">Zona horaria</label>
        <select id="autoThemeTimezone"></select>
        <label for="autoThemeCity">Ciudad de referencia (opcional)</label>
        <select id="autoThemeCity"></select>
        <label for="autoThemeDayStart">Inicio de día (fallback)</label>
        <input id="autoThemeDayStart" type="time" value="07:00" />
        <label for="autoThemeNightStart">Inicio de noche (fallback)</label>
        <input id="autoThemeNightStart" type="time" value="19:00" />
      </section>
    </div>

    <script type="module" src="./assets/js/app.js"></script>
  </body>
</html>
