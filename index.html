<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>CarPlayer · Navidrome</title>
    <style>
      :root {
        --bg: #0b0f17;
        --panel: rgba(255, 255, 255, 0.06);
        --panel2: rgba(255, 255, 255, 0.08);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.7);
        --accent: #00c8b6;
        --danger: #ff5d5d;
        --green: #00c8b6;
        --track: rgba(255, 255, 255, 0.14);
        --buffer: rgba(255, 255, 255, 0.38);
        --border: rgba(255, 255, 255, 0.14);
        --radius: 18px;
        --gap: 12px;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        --font: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans";
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f7fb;
          --panel: rgba(0, 0, 0, 0.04);
          --panel2: rgba(0, 0, 0, 0.06);
          --text: rgba(0, 0, 0, 0.88);
          --muted: rgba(0, 0, 0, 0.62);
          --border: rgba(0, 0, 0, 0.12);
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
        }
      }
      * {
        box-sizing: border-box;
      }
      /* Ocultar scrollbars globalmente */
      * {
        scrollbar-width: none;
      }
      *::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      html,
      body {
        height: 100%;
      }
      html {
        min-height: 100vh;
        background: radial-gradient(1200px 600px at 20% 10%, rgba(0, 200, 182, 0.18), transparent 60%),
          radial-gradient(900px 500px at 90% 20%, rgba(78, 110, 255, 0.12), transparent 55%), var(--bg);
      }
      body {
        margin: 0;
        font-family: var(--font);
        background: transparent;
        color: var(--text);
        overflow: hidden;
      }
      .wrap {
        height: 100vh;
        height: 100dvh;
        height: var(--app-height, 100dvh);
        padding: 8px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: var(--gap);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .title {
        display: grid;
        gap: 2px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.2px;
      }
      .sub {
        color: var(--muted);
        font-size: 12px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.08);
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .segBtn {
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.06);
        color: var(--text);
        font-weight: 800;
        font-size: 12px;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .segBtn.active {
        border-color: rgba(0, 200, 182, 0.6);
        background: linear-gradient(180deg, rgba(0, 200, 182, 0.28), rgba(0, 200, 182, 0.12));
      }
      .grid {
        display: grid;
        grid-template-columns: 340px 1fr 360px;
        gap: var(--gap);
        min-height: 0;
        overflow: hidden;
      }
      @media (max-width: 1100px) {
        .grid {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto 1fr;
        }
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 12px;
        min-height: 0;
        overflow: hidden;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin: 10px 0 6px;
      }
      input,
      select,
      button {
        font: inherit;
      }

      /* Feedback táctil/visual para botones */
      button,
      .btn,
      .cta,
      .ghostBtn,
      .segBtn,
      .tab,
      .songBtn,
      .dangerFab,
      .controls button,
      .controlsBar button {
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        transition: transform 70ms ease, filter 120ms ease, background-color 120ms ease, border-color 120ms ease,
          box-shadow 120ms ease;
      }

      @media (hover: hover) and (pointer: fine) {
        button:hover,
        .btn:hover,
        .cta:hover,
        .ghostBtn:hover,
        .segBtn:hover,
        .tab:hover,
        .songBtn:hover,
        .dangerFab:hover,
        .controls button:hover,
        .controlsBar button:hover {
          filter: brightness(1.06);
          box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
        }
      }

      button:active,
      .btn:active,
      .cta:active,
      .ghostBtn:active,
      .segBtn:active,
      .tab:active,
      .songBtn:active,
      .dangerFab:active,
      .controls button:active,
      .controlsBar button:active {
        transform: translateY(1px) scale(0.99);
        filter: brightness(0.96);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.22);
      }

      button:focus-visible,
      .btn:focus-visible,
      .cta:focus-visible,
      .ghostBtn:focus-visible,
      .segBtn:focus-visible,
      .tab:focus-visible,
      .songBtn:focus-visible,
      .dangerFab:focus-visible,
      .controls button:focus-visible,
      .controlsBar button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(0, 200, 182, 0.18), 0 10px 22px rgba(0, 0, 0, 0.16);
      }

      button:disabled,
      .btn:disabled,
      .cta:disabled,
      .ghostBtn:disabled,
      .segBtn:disabled,
      .tab:disabled,
      .songBtn:disabled,
      .dangerFab:disabled,
      .controls button:disabled,
      .controlsBar button:disabled {
        cursor: not-allowed;
        transform: none;
        filter: none;
        box-shadow: none;
      }
      input,
      select {
        width: 100%;
        padding: 12px 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--panel2);
        color: var(--text);
        outline: none;
      }
      input:focus,
      select:focus {
        border-color: rgba(0, 200, 182, 0.55);
        box-shadow: 0 0 0 3px rgba(0, 200, 182, 0.16);
      }
      .btn {
        width: 100%;
        margin-top: 12px;
        padding: 12px 12px;
        border-radius: 14px;
        border: 1px solid rgba(0, 200, 182, 0.6);
        background: linear-gradient(180deg, rgba(0, 200, 182, 0.26), rgba(0, 200, 182, 0.12));
        color: var(--text);
        font-weight: 650;
        letter-spacing: 0.2px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .btn.secondary {
        border-color: var(--border);
        background: var(--panel2);
        font-weight: 600;
      }
      .btn:disabled {
        opacity: 0.55;
      }
      .status {
        margin-top: 10px;
        color: var(--muted);
        font-size: 12px;
      }
      .status.ok {
        color: rgba(0, 200, 182, 0.95);
      }
      .status.bad {
        color: var(--danger);
      }
      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 10px;
      }
      .tab {
        padding: 10px 10px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.08);
        color: var(--text);
        font-weight: 650;
      }
      .tab[aria-selected="true"] {
        border-color: rgba(0, 200, 182, 0.6);
        background: rgba(0, 200, 182, 0.14);
      }
      .list {
        margin-top: 12px;
        display: grid;
        gap: 8px;
        overflow: auto;
        max-height: 100%;
        padding-right: 6px;
        scrollbar-width: none;
      }
      .list::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      .item {
        display: grid;
        grid-template-columns: 64px 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.06);
      }
      .item:active {
        transform: translateY(1px);
      }
      .cover {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.08);
        object-fit: cover;
      }
      .meta {
        min-width: 0;
      }
      .name {
        font-weight: 700;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .desc {
        margin-top: 2px;
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cta {
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid rgba(0, 200, 182, 0.6);
        background: linear-gradient(180deg, rgba(0, 200, 182, 0.26), rgba(0, 200, 182, 0.12));
        color: var(--text);
        font-weight: 700;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .now {
        display: grid;
        gap: 10px;
        min-height: 0;
        grid-template-rows: auto auto auto auto auto 1fr;
      }
      .nowTop {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 12px;
        align-items: center;
      }
      .coverBig {
        width: 96px;
        height: 96px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.08);
        object-fit: cover;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .controls button {
        padding: 14px 10px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.04));
        color: var(--text);
        font-weight: 800;
        letter-spacing: 0.2px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .controls button.primary {
        border-color: rgba(0, 200, 182, 0.6);
        background: linear-gradient(180deg, rgba(0, 200, 182, 0.3), rgba(0, 200, 182, 0.12));
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .queue {
        display: grid;
        gap: 8px;
        overflow: auto;
        padding-right: 6px;
        scrollbar-width: none;
      }
      .queue::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      .qItem {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: center;
        padding: 10px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.06);
      }
      .qName {
        font-weight: 700;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .qDesc {
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      audio {
        width: 100%;
        height: 40px;
      }

      /* Ocultamos controles nativos: usamos barra propia */
      audio::-webkit-media-controls {
        display: none !important;
      }
      audio[controls]::-webkit-media-controls {
        display: none !important;
      }

      .timeRow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
      }
      .progressWrap {
        position: relative;
        height: 18px;
        border-radius: 999px;
        background: var(--track);
        border: 1px solid rgba(255, 255, 255, 0.10);
        overflow: hidden;
      }
      .progressBuf,
      .progressNow {
        position: absolute;
        inset: 0;
        transform-origin: left center;
        transform: scaleX(0);
      }
      .progressBuf {
        background: var(--buffer);
      }
      .progressNow {
        background: var(--green);
      }
      .seek {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
      }

      /* En 1280×480 puede sobrar altura: deja que la columna izquierda haga scroll */
      #leftCard {
        overflow: auto;
        padding-right: 10px;
      }

      /* Pantallas */
      .screen {
        height: 100%;
        min-height: 0;
      }
      .screen[hidden] {
        display: none !important;
      }

      /* Login */
      .loginWrap {
        height: 100%;
        display: grid;
        place-items: start center;
        padding-top: 12px;
        overflow: auto;
      }
      .loginCard {
        width: min(520px, 100%);
        display: grid;
        gap: 10px;
      }
      .loginCard input,
      .loginCard select {
        color: var(--text);
        background: rgba(255, 255, 255, 0.09);
      }
      .loginCard input::placeholder {
        color: rgba(255, 255, 255, 0.55);
      }

      .inlineRow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .serverValue {
        font-size: 12px;
        color: var(--muted);
        word-break: break-word;
      }
      .serverBtn {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        border-color: rgba(255, 93, 93, 0.7);
        background: rgba(255, 93, 93, 0.2);
        color: #ffebeb;
      }
      .serverBtn.ok {
        border-color: rgba(0, 200, 182, 0.7);
        background: rgba(0, 200, 182, 0.2);
        color: #eafff9;
      }

      .modalTop {
        place-items: start center;
        padding-top: 12px;
      }

      /* Player layout (objetivo: 1280×480) */
      .playerGrid {
        height: 100%;
        min-height: 0;
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: var(--gap);
      }
      @media (max-width: 980px) {
        .playerGrid {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
      }
      .artistsPane {
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 10px;
        min-height: 0;
      }
      .artistsPane > input {
        align-self: start;
      }
      .artistsList {
        overflow: auto;
        padding-right: 6px;
        display: grid;
        gap: 8px;
        align-content: start;
        min-height: 0;
        scrollbar-width: none;
      }
      .artistsList::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      .rightPane {
        display: grid;
        grid-template-rows: 1fr auto;
        gap: var(--gap);
        min-height: 0;
      }
      .nowPanel {
        display: grid;
        grid-template-rows: auto auto auto 1fr;
        gap: 10px;
        min-height: 0;
        position: relative;
      }
      .nowContent {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 16px;
        align-items: center;
      }
      .songMenu {
        display: grid;
        gap: 8px;
        max-height: 280px;
        overflow: auto;
        padding-right: 6px;
        scrollbar-width: none;
      }
      .songMenu::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      .songBtn {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
        align-items: center;
        text-align: left;
        padding: 10px 10px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.04));
        color: var(--text);
        font-weight: 700;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .songBtn.active {
        border-color: rgba(0, 200, 182, 0.6);
        background: linear-gradient(180deg, rgba(0, 200, 182, 0.3), rgba(0, 200, 182, 0.12));
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .songLine {
        font-weight: 800;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nowBg {
        position: absolute;
        inset: 0;
        border-radius: var(--radius);
        overflow: hidden;
        pointer-events: none;
        opacity: 0;
        transition: opacity 180ms ease;
      }
      .nowBg::before {
        content: "";
        position: absolute;
        inset: -20px;
        background-image: var(--cover-url, none);
        background-size: cover;
        background-position: center;
        filter: blur(18px) saturate(1.05);
        transform: scale(1.06);
        opacity: 0.55;
      }
      .nowBg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 20% 20%, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.78)),
          linear-gradient(180deg, rgba(15, 18, 26, 0.25), rgba(15, 18, 26, 0.85));
      }
      .nowPanel > * {
        position: relative;
        z-index: 1;
      }
      .sideBtns {
        display: grid;
        gap: 10px;
        justify-items: stretch;
        align-items: start;
      }
      .sideBtns .ghostBtn {
        width: 180px;
        text-align: center;
      }
      .nowMeta {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        align-items: center;
        justify-items: center;
        text-align: center;
      }
      .coverXL {
        width: clamp(200px, 30vw, 300px);
        height: clamp(200px, 30vw, 300px);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.08);
        object-fit: cover;
      }
      .bigTitle {
        font-weight: 900;
        font-size: 22px;
        line-height: 1.15;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bigSub {
        margin-top: 6px;
        color: var(--muted);
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .controlsBar {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
      }
      .controlsBar button {
        padding: 18px 10px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.04));
        color: var(--text);
        font-weight: 900;
        font-size: 16px;
        letter-spacing: 0.2px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .controlsBar button.primary {
        border-color: rgba(0, 200, 182, 0.6);
        background: linear-gradient(180deg, rgba(0, 200, 182, 0.34), rgba(0, 200, 182, 0.16));
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      }
      .controlsBar button.playing {
        border-color: rgba(0, 200, 182, 0.9);
        background: linear-gradient(180deg, rgba(0, 200, 182, 0.65), rgba(0, 200, 182, 0.28));
        color: #0b0f17;
        box-shadow: 0 16px 28px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .topBar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 2px;
      }
      .ghostBtn {
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.06);
        color: var(--text);
        font-weight: 800;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .ghostBtn.serverBtn {
        border-color: rgba(255, 93, 93, 0.7);
        background: rgba(255, 93, 93, 0.25);
        color: #ffebeb;
      }
      .ghostBtn.serverBtn.ok {
        border-color: rgba(0, 200, 182, 0.7);
        background: rgba(0, 200, 182, 0.25);
        color: #eafff9;
      }

      .dangerFab {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 30;
        padding: 12px 14px;
        border-radius: 16px;
        border: 1px solid rgba(255, 93, 93, 0.65);
        background: linear-gradient(180deg, rgba(255, 93, 93, 0.32), rgba(255, 93, 93, 0.16));
        color: rgba(255, 255, 255, 0.95);
        font-weight: 900;
        letter-spacing: 0.2px;
        box-shadow: 0 12px 22px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }

      /* Modal simple para álbumes */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: grid;
        place-items: center;
        padding: 14px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 2000;
      }
      .modal[hidden] {
        display: none !important;
      }
      .modalCard {
        width: min(980px, 100%);
        max-height: min(460px, 100%);
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 10px;
        background: rgba(15, 18, 26, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: rgba(255, 255, 255, 0.92);
      }
      .modalCard input,
      .modalCard select {

      function normalizeServer(input) {
        const raw = (input || "").trim();
        return raw.endsWith("/") ? raw.slice(0, -1) : raw;

        const v = localStorage.getItem("carplayer.navidrome.server");

        const s = normalizeServer(server);
        if (!s) {
          localStorage.removeItem("carplayer.navidrome.server");

      function randSalt(len = 16) {

          a = ii(a, b, c, d, k[4], 6, -145523070);

      function baseParams(auth) {
        return {
          u: auth.u,
          t: auth.t,
          s: auth.s,
          v: "1.16.1",
          c: "carplayer",
          f: "json",
        };

      function buildRestUrl(server, viewName, params) {
        const base = normalizeServer(server);
        const qs = new URLSearchParams();
        Object.entries(params || {}).forEach(([k, v]) => {
          if (v === undefined || v === null || v === "") return;
          qs.set(k, String(v));
        });
        return `${base}/rest/${viewName}.view?${qs.toString()}`;
      }

      async function restJson(server, auth, viewName, params) {
        const url = buildRestUrl(server, viewName, { ...baseParams(auth), ...(params || {}) });
        const resp = await fetch(url, { method: "GET" });
        const text = await resp.text();
        let json;
        try {
          json = JSON.parse(text);
        } catch {
          throw new Error(`Respuesta no JSON (${resp.status})`);
        }
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const sub = json["subsonic-response"];
        if (!sub) throw new Error("Respuesta Subsonic inválida");
        if (sub.status !== "ok") {
          const msg = sub.error?.message || `error code ${sub.error?.code ?? "?"}`;
          throw new Error(msg);
        }
        return sub;
      }

      function makeAuth(username, password) {
        const salt = randSalt(12);
        const token = md5(password + salt);
        return { u: username, s: salt, t: token };

              await selectGenre(name);
              setStatus("OK.", "ok");
            } catch (e) {
              setStatus(`Error: ${String(e)}`, "bad");
            }
          };
          div.querySelector("button").addEventListener("click", (e) => {
            e.stopPropagation();
            open();
          });
          div.addEventListener("click", () => open());
          artistsList.appendChild(div);
        }
      }

      function renderAlbums(list) {
        artistsList.innerHTML = "";
        const items = list || [];
        for (const al of items) {
          const div = document.createElement("div");
          div.className = "item";
          const imgSrc = al.coverArt ? coverUrl(state.server, state.auth, al.coverArt, 128) : "";
          div.innerHTML = `
            <img class="cover" alt="" src="${imgSrc}"/>
            <div class="meta">
              <div class="name">${escapeHtml(al.name || "—")}</div>
              <div class="desc">${escapeHtml(al.artist || "")}</div>
            </div>
            <button class="cta">Reproducir</button>
          `;
          const play = async () => {
            try {
              await playAlbum(al.id);
              setStatus("OK.", "ok");
            } catch (e) {
              setStatus(`Error: ${String(e)}`, "bad");
            }
          };
          div.querySelector("button").addEventListener("click", (e) => {
            e.stopPropagation();
            play();
          });
          div.addEventListener("click", () => play());
          artistsList.appendChild(div);
        }
      }

      function escapeHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function fmtTime(seconds) {
        const s = Number.isFinite(seconds) ? Math.max(0, Math.floor(seconds)) : 0;
        const m = Math.floor(s / 60);
        const r = s % 60;
        return `${m}:${String(r).padStart(2, "0")}`;
      }

      function setBar(el, ratio) {
        const r = Number.isFinite(ratio) ? Math.max(0, Math.min(1, ratio)) : 0;
        el.style.transform = `scaleX(${r})`;
      }

      function updateProgress() {
        const dur = Number.isFinite(player.duration) && player.duration > 0 ? player.duration : 0;
        const cur = Number.isFinite(player.currentTime) ? player.currentTime : 0;

        tNow.textContent = fmtTime(cur);
        tDur.textContent = fmtTime(dur);

        if (!dur) {
          setBar(nowBar, 0);
          setBar(bufBar, 0);
          seekEl.value = "0";
          return;
        }

        setBar(nowBar, cur / dur);

        let buf = 0;
        try {
          const b = player.buffered;
          if (b && b.length) {
            buf = b.end(b.length - 1);
          }
        } catch {
          buf = 0;
        }
        setBar(bufBar, buf / dur);

        if (!seekEl.matches(":active")) {
          seekEl.value = String(Math.round((cur / dur) * 1000));
        }

        if ("mediaSession" in navigator && typeof navigator.mediaSession.setPositionState === "function" && dur) {
          try {
            navigator.mediaSession.setPositionState({
              duration: dur,
              position: cur,
              playbackRate: player.playbackRate || 1,
            });
          } catch {
            // ignore
          }
        }
      }

      function updatePlayPauseUI() {
        const playing = !player.paused && !player.ended;
        btnPlayPause.classList.toggle("playing", playing);
        if ("mediaSession" in navigator) {
          navigator.mediaSession.playbackState = playing ? "playing" : "paused";
        }
      }

      function setNow(track) {
        if (!track) {
          nowTitle.textContent = "Nada reproduciendo";
          nowSub.textContent = "—";
          nowCover.removeAttribute("src");
          nowBg.style.opacity = "0";
          nowBg.style.removeProperty("--cover-url");
          return;
        }
        nowTitle.textContent = track.title || "—";
        nowSub.textContent = `${track.artist || ""}${track.album ? " · " + track.album : ""}`;
        const coverId = track.coverArt || track.albumId || null;
        state.lastCoverId = coverId;
        if (coverId) {
          const coverSrc = coverUrl(state.server, state.auth, coverId, 600);
          nowCover.src = coverSrc;
          nowBg.style.setProperty("--cover-url", `url("${coverSrc}")`);
          nowBg.style.opacity = "1";
        } else {
          nowCover.removeAttribute("src");
          nowBg.style.opacity = "0";
          nowBg.style.removeProperty("--cover-url");
        }

        if ("mediaSession" in navigator) {
          const art = coverId ? coverUrl(state.server, state.auth, coverId, 512) : null;
          try {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: track.title || "",
              artist: track.artist || "",
              album: track.album || "",
              artwork: art
                ? [
                    { src: art, sizes: "512x512", type: "image/jpeg" },
                    { src: art, sizes: "256x256", type: "image/jpeg" },
                  ]
                : [],
            });
          } catch {
            // ignore
          }
        }
      }

      function playIndex(idx) {
        if (idx < 0 || idx >= state.queue.length) return;
        state.queueIndex = idx;
        const track = state.queue[idx];
        setNow(track);
	        renderSongMenu();
	        maybePrefetchRandom();
	        const url = streamUrl(state.server, state.auth, track.id);
	        (async () => {
	          player.src = url;
	          try {
	            await player.play();
	          } catch {
	            // ignore (autoplay restrictions)
          }
        })();
      }

      function playNext(delta) {
        if (state.queue.length === 0) return;
        let next = state.queueIndex + delta;
        if (next < 0) next = 0;
        if (next >= state.queue.length) next = state.queue.length - 1;
        playIndex(next);
      }

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      }

      function shuffleQueue(keepCurrent = true) {
        if (!state.queue || state.queue.length < 2) return;
        if (!keepCurrent || state.queueIndex < 0) {
          shuffleArray(state.queue);
          state.queueIndex = 0;
          return;
        }
        const current = state.queue[state.queueIndex];
        const rest = state.queue.filter((_, i) => i !== state.queueIndex);
        shuffleArray(rest);
        state.queue = [current, ...rest];
        state.queueIndex = 0;
      }

      player.addEventListener("ended", () => {
        if (state.queueIndex + 1 < state.queue.length) playIndex(state.queueIndex + 1);
        updatePlayPauseUI();
      });
      player.addEventListener("play", updatePlayPauseUI);
      player.addEventListener("pause", updatePlayPauseUI);
      player.addEventListener("timeupdate", updateProgress);
      player.addEventListener("progress", updateProgress);
      player.addEventListener("loadedmetadata", updateProgress);
      player.addEventListener("durationchange", updateProgress);

      seekEl.addEventListener("input", () => {
        const dur = Number.isFinite(player.duration) && player.duration > 0 ? player.duration : 0;
        if (!dur) return;
        const v = Number(seekEl.value) / 1000;
        setBar(nowBar, v);
        tNow.textContent = fmtTime(dur * v);
      });
      seekEl.addEventListener("change", () => {
        const dur = Number.isFinite(player.duration) && player.duration > 0 ? player.duration : 0;
        if (!dur) return;
        const v = Number(seekEl.value) / 1000;
        player.currentTime = dur * v;
        updateProgress();
      });

      btnPrev.addEventListener("click", () => playNext(-1));
      btnNext.addEventListener("click", () => playNext(1));
      btnPlayPause.addEventListener("click", async () => {
        if (player.paused) {
          try {
            await player.play();
          } catch {}
        } else {
          player.pause();
        }
        updatePlayPauseUI();
      });

      btnPlayAll.addEventListener("click", async () => {
        await playAllRandom();
      });

      if ("mediaSession" in navigator) {
        try {
          navigator.mediaSession.setActionHandler("play", async () => {
            try {
              await player.play();
            } catch {}
          });
          navigator.mediaSession.setActionHandler("pause", () => player.pause());
          navigator.mediaSession.setActionHandler("previoustrack", () => playNext(-1));
          navigator.mediaSession.setActionHandler("nexttrack", () => playNext(1));
          navigator.mediaSession.setActionHandler("seekto", (details) => {
            if (details && Number.isFinite(details.seekTime)) {
              player.currentTime = details.seekTime;
              updateProgress();
            }
          });
          navigator.mediaSession.setActionHandler("seekbackward", (details) => {
            const delta = details && Number.isFinite(details.seekOffset) ? details.seekOffset : 10;
            player.currentTime = Math.max(0, player.currentTime - delta);
            updateProgress();
          });
          navigator.mediaSession.setActionHandler("seekforward", (details) => {
            const delta = details && Number.isFinite(details.seekOffset) ? details.seekOffset : 10;
            player.currentTime = Math.min(player.duration || player.currentTime + delta, player.currentTime + delta);
            updateProgress();
          });
        } catch {
          // ignore
        }
      }

      async function loadRandomBlock(count = 20) {
        const sub = await restJson(state.server, state.auth, "getRandomSongs", { size: count });
        const songs = sub.randomSongs?.song || [];
        const mapped = songs.map((s) => ({
          id: s.id,
          title: s.title,
          artist: s.artist,
          album: s.album,
          albumId: s.albumId,
          coverArt: s.coverArt,
        }));
        if (state.queue.length === 0) {
          state.queue = mapped;
          state.queueIndex = 0;
          btnSongs.disabled = state.queue.length === 0;
          btnSongs.textContent = state.queue.length ? `Canciones (${state.queue.length})` : "Canciones";
          state.randomPrefetchAt = state.queue.length;
          if (state.queue.length) playIndex(0);
        } else {
          state.queue = state.queue.concat(mapped);
          btnSongs.disabled = state.queue.length === 0;
          btnSongs.textContent = state.queue.length ? `Canciones (${state.queue.length})` : "Canciones";
          state.randomPrefetchAt = state.queue.length;
        }
      }

      async function maybePrefetchRandom() {
        if (!state.shuffleEnabled || !state.randomMode) return;
        if (state.randomLoading) return;
        if (state.queue.length === 0) return;
        const remaining = state.queue.length - 1 - state.queueIndex;
        if (remaining > 5) return; // antes de la 15ª si tenemos bloques de 20
        if (state.randomPrefetchAt && state.queue.length < state.randomPrefetchAt) return;
        state.randomLoading = true;
        try {
          await loadRandomBlock(20);
        } catch (e) {
          // silencioso: si falla, intentará en el siguiente avance
        } finally {
          state.randomLoading = false;
        }
      }

      function setShuffleUI() {
        if (state.shuffleEnabled) {
          btnShuffle.classList.add("primary");
          btnShuffle.textContent = "Aleatorio ✓";
        } else {
          btnShuffle.classList.remove("primary");
          btnShuffle.textContent = "Aleatorio";
        }
      }

      btnShuffle.addEventListener("click", async () => {
        state.shuffleEnabled = !state.shuffleEnabled;
        setShuffleUI();
        if (state.shuffleEnabled) {
          if (state.queue.length > 0) {
            shuffleQueue(true);
            state.randomMode = false;
          } else {
            setStatus("Aleatorio: cargando 20 canciones…");
            try {
              state.randomMode = true;
              await loadRandomBlock(20);
              setStatus("OK.", "ok");
            } catch (e) {
              setStatus(`Error: ${String(e)}`, "bad");
            }
          }
        } else {
          state.randomMode = false;
        }
      });

      async function loadArtists() {
        const sub = await restJson(state.server, state.auth, "getArtists", {});
        const indexes = sub.artists?.index || [];
        const artists = [];
        for (const idx of indexes) {
          for (const a of idx.artist || []) artists.push(a);
        }
        state.artists = artists;
        state.artistsFiltered = artists;
        renderArtists(artists);
      }

      async function loadGenres() {
        const sub = await restJson(state.server, state.auth, "getGenres", {});
        const genres = sub.genres?.genre || [];
        state.genres = genres;
        state.genresFiltered = genres;
        renderGenres(genres);
      }

      async function loadAlbums() {
        const sub = await restJson(state.server, state.auth, "getAlbumList2", {
          type: "alphabeticalByName",
          size: 200,
          offset: 0,
        });
        const albums = sub.albumList2?.album || [];
        state.albums = albums;
        state.albumsFiltered = albums;
        renderAlbums(albums);
      }

      async function getArtistAlbums(artistId) {
        const cached = state.artistAlbumsById[artistId];
        if (Array.isArray(cached)) return cached;
        const sub = await restJson(state.server, state.auth, "getArtist", { id: artistId });
        const albums = sub.artist?.album || [];
        state.artistAlbumsById[artistId] = albums;
        return albums;
      }

      async function playAlbum(albumId) {
        const sub = await restJson(state.server, state.auth, "getAlbum", { id: albumId });
        const songs = sub.album?.song || [];
        state.queue = songs.map((s) => ({
          id: s.id,
          title: s.title,
          artist: s.artist,
          album: s.album,
          albumId: s.albumId,
          coverArt: s.coverArt,
        }));
        state.queueIndex = 0;
        btnSongs.disabled = state.queue.length === 0;
        btnSongs.textContent = state.queue.length ? `Canciones (${state.queue.length})` : "Canciones";
        state.randomMode = false;
        renderSongMenu();
        if (state.shuffleEnabled) shuffleQueue(true);
        playIndex(0);
      }

      async function playAllRandom() {
        setStatus("Aleatorio: cargando 20 canciones…");
        state.shuffleEnabled = true;
        setShuffleUI();
        state.randomMode = true;
        state.queue = [];
        state.queueIndex = -1;
        try {
          await loadRandomBlock(20);
          setStatus("OK.", "ok");
        } catch (e) {
          setStatus(`Error: ${String(e)}`, "bad");
        }
      }

      async function selectArtist(artistId, name, opts) {
        state.selectedArtist = { id: artistId, name };
        state.selectedGenre = null;
        btnAlbums.disabled = true;
        state.selectedArtistAlbums = [];

        const albums = await getArtistAlbums(artistId);
        state.selectedArtistAlbums = albums;
        btnAlbums.disabled = albums.length === 0;
        btnAlbums.textContent = albums.length ? `Álbumes (${albums.length})` : "Álbumes";
        if (opts?.openModal) openAlbumsModal();
      }

      async function selectGenre(genreName) {
        state.selectedGenre = { name: genreName };
        state.selectedArtist = null;
        btnAlbums.disabled = true;
        state.selectedGenreAlbums = [];

        const sub = await restJson(state.server, state.auth, "getAlbumList2", { type: "byGenre", genre: genreName, size: 200, offset: 0 });
        const albums = sub.albumList2?.album || [];
        state.selectedGenreAlbums = albums;
        btnAlbums.disabled = albums.length === 0;
        btnAlbums.textContent = albums.length ? `Álbumes (${albums.length})` : "Álbumes";
        openAlbumsModal();
      }

      function openAlbumsModal() {
        const a = state.selectedArtist;
        const g = state.selectedGenre;
        const albums = a ? state.selectedArtistAlbums : state.selectedGenreAlbums;
        if (a) {
          albumsTitle.textContent = `Álbumes · ${a.name}`;
        } else if (g) {
          albumsTitle.textContent = `Álbumes · ${g.name}`;
        } else {
          albumsTitle.textContent = "Álbumes";
        }
        albumsList.innerHTML = "";
        btnPlayAllAlbums.disabled = albums.length === 0;
        for (const al of albums) {
          const div = document.createElement("div");
          div.className = "item";
          const imgSrc = al.coverArt ? coverUrl(state.server, state.auth, al.coverArt, 128) : "";
          div.innerHTML = `
            <img class="cover" alt="" src="${imgSrc}"/>
            <div class="meta">
              <div class="name">${escapeHtml(al.name || "—")}</div>
              <div class="desc">${escapeHtml(a?.name || "")}</div>
            </div>
            <button class="cta">Play</button>
          `;
          div.querySelector("button").addEventListener("click", async (e) => {
            e.stopPropagation();
            try {
              await playAlbum(al.id);
              closeAlbumsModal();
            } catch (err) {
              setStatus(`Error: ${String(err)}`, "bad");
            }
          });
          div.addEventListener("click", async () => {
            try {
              await playAlbum(al.id);
              closeAlbumsModal();
            } catch (err) {
              setStatus(`Error: ${String(err)}`, "bad");
            }
          });
          albumsList.appendChild(div);
        }
        albumsModal.hidden = false;
      }

      function closeAlbumsModal() {
        albumsModal.hidden = true;
      }

      async function playAllAlbums() {
        const albums = state.selectedArtist ? state.selectedArtistAlbums : state.selectedGenreAlbums;
        if (!albums.length) return;
        const cacheKey = state.selectedArtist ? `artist:${state.selectedArtist.id}` : state.selectedGenre ? `genre:${state.selectedGenre.name}` : null;
        const cached = cacheKey ? state.artistSongsById[cacheKey] : null;
        if (Array.isArray(cached) && cached.length) {
          state.queue = cached;
          state.queueIndex = 0;
          btnSongs.disabled = state.queue.length === 0;
          btnSongs.textContent = state.queue.length ? `Canciones (${state.queue.length})` : "Canciones";
          state.randomMode = false;
          renderSongMenu();
          if (state.shuffleEnabled) shuffleQueue(true);
          if (state.queue.length) playIndex(0);
          closeAlbumsModal();
          return;
        }

        setStatus(`Cargando ${albums.length} álbumes…`);
        btnPlayAllAlbums.disabled = true;
        const allSongs = [];
        try {
          const concurrency = 4;
          let index = 0;
          let done = 0;
          const total = albums.length;

          async function worker() {
            while (index < total) {
              const i = index++;
              const al = albums[i];
              const sub = await restJson(state.server, state.auth, "getAlbum", { id: al.id });
              const songs = sub.album?.song || [];
              for (const s of songs) {
                allSongs.push({
                  id: s.id,
                  title: s.title,
                  artist: s.artist,
                  album: s.album,
                  albumId: s.albumId,
                  coverArt: s.coverArt,
                });
              }
              done++;
              setStatus(`Cargando álbumes… ${done}/${total}`);
            }
          }

          const workers = Array.from({ length: concurrency }, () => worker());
          await Promise.all(workers);

          if (cacheKey) state.artistSongsById[cacheKey] = allSongs.slice();

          state.queue = allSongs;
          state.queueIndex = 0;
          btnSongs.disabled = state.queue.length === 0;
          btnSongs.textContent = state.queue.length ? `Canciones (${state.queue.length})` : "Canciones";
          state.randomMode = false;
          renderSongMenu();
          if (state.shuffleEnabled) shuffleQueue(true);
          if (state.queue.length) playIndex(0);
          setStatus("OK.", "ok");
          closeAlbumsModal();
        } catch (e) {
          setStatus(`Error: ${String(e)}`, "bad");
        } finally {
          btnPlayAllAlbums.disabled = false;
        }
      }

      function openSongsModal() {
        if (!state.queue || state.queue.length === 0) return;
        const current = state.queue[state.queueIndex] || null;
        songsTitle.textContent = current?.album ? `Canciones · ${current.album}` : "Canciones";
        songsList.innerHTML = "";
        state.queue.forEach((t, idx) => {
          const div = document.createElement("div");
          div.className = "item";
          const active = idx === state.queueIndex;
          div.innerHTML = `
            <div class="cover" style="display:grid;place-items:center;font-weight:900">${active ? "▶" : String(idx + 1)}</div>
            <div class="meta">
              <div class="name">${escapeHtml(t.title || "—")}</div>
              <div class="desc">${escapeHtml(t.artist || "")}</div>
            </div>
            <button class="cta">Play</button>
          `;
          div.querySelector("button").addEventListener("click", (e) => {
            e.stopPropagation();
            playIndex(idx);
            closeSongsModal();
          });
          div.addEventListener("click", () => {
            playIndex(idx);
            closeSongsModal();
          });
          songsList.appendChild(div);
        });
        songsModal.hidden = false;
      }

      function closeSongsModal() {
        songsModal.hidden = true;
      }

      btnAlbums.addEventListener("click", () => {
        if (btnAlbums.disabled) return;
        openAlbumsModal();
      });
      btnPlayAllAlbums.addEventListener("click", () => playAllAlbums());
      btnCloseAlbums.addEventListener("click", () => closeAlbumsModal());
      albumsModal.addEventListener("click", (e) => {
        if (e.target === albumsModal) closeAlbumsModal();
      });

      btnSongs.addEventListener("click", () => {
        if (btnSongs.disabled) return;
        openSongsModal();
      });
      btnCloseSongs.addEventListener("click", () => closeSongsModal());
      songsModal.addEventListener("click", (e) => {
        if (e.target === songsModal) closeSongsModal();
      });

      async function connect() {
        const server = getStoredServer();
        const username = (userEl.value || "").trim();
        const password = passEl.value || "";
        if (!server) {
          setStatus("Configura el servidor primero.", "bad");
          openServerModal();
          return;
        }
        if (!username || !password) {
          setStatus("Falta usuario/contraseña.", "bad");
          return;
        }
        setStatus("Conectando…");
        btnConnect.disabled = true;

        const auth = makeAuth(username, password);
        try {
          await restJson(server, auth, "ping", {});
          state.server = server;
          state.auth = auth;
          setStoredServer(server);
          localStorage.setItem("carplayer.navidrome.user", username);
          // Nota: esto guarda la contraseña en el navegador (solo este dispositivo).
          // Recomiendo usar un usuario Navidrome dedicado para el coche.
          localStorage.setItem("carplayer.navidrome.pass", password);
          setStatus("OK. Conectado.", "ok");
          showScreen("player");
          setViewMode("artists");
        } catch (e) {
          setStatus(`Error: ${String(e)}`, "bad");
        } finally {
          btnConnect.disabled = false;
        }
      }

      btnConnect.addEventListener("click", () => connect());
      userEl.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        passEl.focus();
      });
      passEl.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        connect();
      });

      (function prefill() {
        setStoredServer(getStoredServer());
        const user = localStorage.getItem("carplayer.navidrome.user");
        const pass = localStorage.getItem("carplayer.navidrome.pass");
        if (user) userEl.value = user;
        if (pass) passEl.value = pass;
      })();

      // Evita que el teclado tape el input (especialmente en navegadores “car”).
      [userEl, passEl].forEach((el) => {
        el.addEventListener("focus", () => {
          setTimeout(() => {
            setAppHeight();
            try {
              el.scrollIntoView({ block: "center", behavior: "smooth" });
            } catch {
              // ignore
            }
          }, 50);
        });
      });

      btnLogout.addEventListener("click", () => {
        state.auth = null;
        state.queue = [];
        state.queueIndex = -1;
        state.selectedArtist = null;
        state.selectedArtistAlbums = [];
        state.artistAlbumsById = {};
        state.artistSongsById = {};
        state.selectedGenre = null;
        state.selectedGenreAlbums = [];
        state.albums = [];
        state.albumsFiltered = [];
        btnAlbums.disabled = true;
        btnAlbums.textContent = "Álbumes";
        btnSongs.disabled = true;
        btnSongs.textContent = "Canciones";
        state.shuffleEnabled = false;
        state.randomMode = false;
        state.randomLoading = false;
        state.randomPrefetchAt = 0;
        setShuffleUI();
        setNow(null);
        songMenu.innerHTML = "";
        player.pause();
        player.removeAttribute("src");
        updateProgress();
        showScreen("login");
        setStatus("Sesión cerrada.", "");
      });

      function renderSongMenu() {
        songMenu.innerHTML = "";
        if (!state.queue || state.queue.length === 0) return;
        state.queue.forEach((t, idx) => {
          const btn = document.createElement("button");
          btn.className = "songBtn" + (idx === state.queueIndex ? " active" : "");
          btn.innerHTML = `
            <div class="songLine">${idx + 1} - ${escapeHtml(t.title || "—")}</div>
          `;
          btn.addEventListener("click", () => playIndex(idx));
          songMenu.appendChild(btn);
        });
      }

      btnClearArtists.addEventListener("click", () => {
        artistFilter.value = "";
        applyListFilter();
        artistsList.scrollTo({ top: 0, behavior: "smooth" });
      });

      function applyListFilter() {
        const q = (artistFilter.value || "").trim().toLowerCase();
        if (state.viewMode === "genres") {
          if (!q) {
            state.genresFiltered = state.genres;
          } else {
            state.genresFiltered = state.genres.filter((g) => (g.value || g.name || "").toLowerCase().includes(q));
          }
          renderGenres(state.genresFiltered);
        } else if (state.viewMode === "albums") {
          if (!q) {
            state.albumsFiltered = state.albums;
          } else {
            state.albumsFiltered = state.albums.filter((a) => (a.name || "").toLowerCase().includes(q));
          }
          renderAlbums(state.albumsFiltered);
        } else {
          if (!q) {
            state.artistsFiltered = state.artists;
          } else {
            state.artistsFiltered = state.artists.filter((a) => (a.name || "").toLowerCase().includes(q));
          }
          renderArtists(state.artistsFiltered);
        }
      }

      let filterTimer = null;
      artistFilter.addEventListener("input", () => {
        if (filterTimer) clearTimeout(filterTimer);
        filterTimer = setTimeout(() => applyListFilter(), 120);
      });

      function setViewMode(mode) {
        state.viewMode = mode;
        btnViewArtists.classList.toggle("active", mode === "artists");
        btnViewGenres.classList.toggle("active", mode === "genres");
        btnViewAlbums.classList.toggle("active", mode === "albums");
        artistFilter.value = "";
        artistFilter.placeholder =
          mode === "genres" ? "Filtrar género…" : mode === "albums" ? "Filtrar álbum…" : "Filtrar artista…";
        if (mode === "genres") {
          loadGenres().catch((e) => setStatus(String(e), "bad"));
        } else if (mode === "albums") {
          loadAlbums().catch((e) => setStatus(String(e), "bad"));
        } else {
          loadArtists().catch((e) => setStatus(String(e), "bad"));
        }
      }

      btnViewArtists.addEventListener("click", () => setViewMode("artists"));
      btnViewGenres.addEventListener("click", () => setViewMode("genres"));
      btnViewAlbums.addEventListener("click", () => setViewMode("albums"));

      showScreen("login");

      // Auto-login si el usuario eligió "recordarme" y hay credenciales guardadas.
      (function autoLoginIfRemembered() {
        const pass = localStorage.getItem("carplayer.navidrome.pass");
        if (!pass) return;
        if (!userEl.value || !getStoredServer()) return;
        setStatus("Autoconectando…");
        // Deja que la UI pinte antes de lanzar requests.
        setTimeout(() => connect(), 50);
      })();

      setShuffleUI();
    </script>
  </body>
</html>
